name: Publish images

# Build and push the Spockify router (and, optionally, the Open WebUI fork)
# to GitHub Container Registry (GHCR) under this repository's owner.
#
# Trigger on version tags (v1.2.3) or manually. Pull with:
#   docker pull ghcr.io/<owner>/spockify-router:latest
# and set SPOCKIFY_ROUTER_IMAGE in your .env to that tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_openwebui:
        description: "Also build and push the Open WebUI fork image"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/spockify-router
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push router
        uses: docker/build-push-action@v6
        with:
          context: ./services/router
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  openwebui:
    # Only on manual dispatch with the flag. Review Open WebUI's license before
    # publishing a rebranded image.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_openwebui }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Open WebUI fork
        uses: docker/build-push-action@v6
        with:
          context: ./services/openwebui
          push: true
          build-args: |
            BUILD_HASH=spockify-oss
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/spockify-openwebui:latest
