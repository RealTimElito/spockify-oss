# LiteLLM — OSS / docker-compose. spockify-auto is the router, not a raw Ollama tag.
# Default pull: llama3.2:3b, llama3.1:8b, codestral.
# Opt-in: gemma4:12b, devstral-small-2. Huge opt-in (Spark/~75GB): devstral-2.

model_list:
  - model_name: llama3.2-3b
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120

  # Family-only shorthand — orchestrator sometimes emits bare "llama".
  - model_name: llama
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120
    model_info:
      description: "Alias for llama3.2:3b — bare llama is not a pulled tag"

  - model_name: llama3.2-3b-cpu
    litellm_params:
      model: ollama_chat/llama3.2-3b-cpu
      api_base: http://ollama:11434
      timeout: 120
    model_info:
      description: "CPU-only llama3.2:3b (num_gpu 0) — greetings/orchestrator without VRAM"

  - model_name: llama3.1-8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434
      timeout: 180

  - model_name: llama3.2-8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434
      timeout: 180
    model_info:
      description: "Alias — Llama 3.2 has no 8B; this is llama3.1:8b"

  - model_name: gemma4-12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama:11434
      timeout: 180

  - model_name: codestral
    litellm_params:
      model: ollama_chat/codestral
      api_base: http://ollama:11434
      timeout: 300
    model_info:
      description: "Code + IDE Tab FIM"

  - model_name: devstral-small-2
    litellm_params:
      model: ollama_chat/devstral-small-2
      api_base: http://ollama:11434
      timeout: 300
    model_info:
      description: "Devstral Small 2 24B agentic coder (~15GB, 16GB VRAM)"

  - model_name: devstral-2
    litellm_params:
      model: ollama_chat/devstral-2
      api_base: http://ollama:11434
      timeout: 600
    model_info:
      description: "Devstral 2 123B agentic coder (~75GB; opt-in only — not in default OLLAMA_PULL_MODELS)"

  - model_name: orchestrator
    litellm_params:
      model: ollama_chat/llama3.2-3b-cpu
      api_base: http://ollama:11434
      timeout: 120

  - model_name: orchestrator-fallback
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434
      timeout: 180

  - model_name: spockify-auto
    litellm_params:
      model: openai/spockify-auto
      api_base: http://router:4100/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 300
    model_info:
      description: "Router — pattern match or orchestrator, then a worker"

  - model_name: spockify-room
    litellm_params:
      model: openai/spockify-room
      api_base: http://router:4100/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 600
    model_info:
      description: "Multi-agent room (researcher + coder + critic)"

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
