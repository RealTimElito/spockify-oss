[project]
name = "spockify-mcp"
version = "0.1.0"
description = "Spockify read-only MCP tools for cluster ops (Cursor + Cloud Agents)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
spockify-mcp = "spockify_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spockify_mcp*"]
