# Dev override — Docker Compose service names, gemma3 fallback if gemma4 not pulled.
model_list:
  - model_name: orchestrator
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama:11434
      timeout: 120
  - model_name: orchestrator-fallback
    litellm_params:
      model: ollama_chat/gemma3:12b
      api_base: http://ollama:11434
      timeout: 120
  - model_name: codestral
    litellm_params:
      model: ollama_chat/codestral
      api_base: http://ollama:11434
      timeout: 300
  - model_name: gemma4-12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama:11434
      timeout: 120
  - model_name: gemma3-12b
    litellm_params:
      model: ollama_chat/gemma3:12b
      api_base: http://ollama:11434
      timeout: 120
  - model_name: llama3.1-8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://ollama:11434
      timeout: 120
  - model_name: spockify-auto
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://ollama:11434
      timeout: 300

router_settings:
  routing_strategy: simple-shuffle
  model_group_alias:
    code: ["codestral"]
    chat: ["llama3.1-8b"]
    reasoning: ["gemma4-12b", "gemma3-12b"]

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
