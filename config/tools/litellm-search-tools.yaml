# LiteLLM search_tools + websearch_interception fragment.
# Merged into config/litellm.yaml (source of truth via k8s/litellm kustomize).

search_tools:
  - search_tool_name: spockify-searxng
    litellm_params:
      search_provider: searxng
      api_base: http://searxng.spockify.svc.cluster.local:8080

